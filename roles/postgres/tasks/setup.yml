---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-contrib-{{ postgres_version }}"
      - python3-psycopg2
    state: present

- name: Initialize PostgreSQL cluster
  ansible.builtin.shell: |
    cd /tmp && \
    sudo pg_ctlcluster {{ postgres_version }} main stop || true && \
    sudo pg_dropcluster {{ postgres_version }} main || true && \
    sudo pg_createcluster {{ postgres_version }} main --start

- name: Ensure PostgreSQL is listening
  ansible.builtin.wait_for:
    port: 5432
    timeout: 30

- name: Configure pg_hba.conf
  ansible.builtin.copy:
    src: pg_hba.conf
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: '0640'
    backup: yes
  notify: reload postgresql

- name: IMMEDIATELY reload PostgreSQL
  ansible.builtin.meta: flush_handlers

- name: Install acl package
  ansible.builtin.apt:
    name: acl
    state: present
